global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'forge-orchestrator'
    static_configs:
      - targets: ['host.docker.internal:9091']

  - job_name: 'forge-agents'
    static_configs:
      - targets: ['host.docker.internal:9092']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
