# Deploy Orchestrator — Build & Push Docker image to GHCR
#
# Triggered only when packages/orchestrator/** changes on push to main.
# Builds a multi-stage Docker image and pushes two tags to the GitHub
# Container Registry (ghcr.io):
#   1. ghcr.io/<owner>/<repo>/orchestrator:<git-sha>   (immutable, for rollback)
#   2. ghcr.io/<owner>/<repo>/orchestrator:latest      (floating, for convenience)
#
# Required permissions / secrets:
#   GITHUB_TOKEN — automatically provided by Actions; no manual secret needed.
#                  The workflow requests `packages: write` so it can push to GHCR.

name: Deploy Orchestrator

on:
  push:
    branches:
      - main
    paths:
      - "packages/orchestrator/**"
      # Rebuild if the shared packages the orchestrator depends on change
      - "packages/shared/**"
      - "packages/database/**"
      # Rebuild if the workflow itself changes
      - ".github/workflows/deploy-orchestrator.yml"

# Cancel any in-progress build/push if a new commit arrives, to avoid
# pushing an outdated image and wasting registry storage.
concurrency:
  group: deploy-orchestrator-${{ github.ref }}
  cancel-in-progress: true

# Grant the GITHUB_TOKEN the minimum permissions needed for this workflow.
permissions:
  contents: read   # Checkout the repository
  packages: write  # Push Docker images to ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to the GitHub Container Registry using the built-in GITHUB_TOKEN.
      # No external credentials required — GHCR is tightly integrated with Actions.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract structured metadata (tags, labels) from the Git context.
      # docker/metadata-action generates OCI-compliant labels and the two
      # image tags we want: the immutable SHA tag and the floating `latest`.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/orchestrator
          tags: |
            # Immutable tag: exact git commit SHA (40-char hex)
            type=sha,format=long,prefix=
            # Floating tag: `latest` on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Forge Orchestrator
            org.opencontainers.image.description=Forge Agent Orchestrator — event bus, routing, context, approvals, confidence
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Set up Docker Buildx for multi-platform support and layer caching.
      # Buildx is required for cache-to/cache-from with gha (GitHub Actions cache).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the image. Layer caching uses the GitHub Actions cache
      # backend (`type=gha`) so unchanged layers are not rebuilt on every run.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Build context is the monorepo root so COPY can reach shared packages
          context: .
          # Path to the Dockerfile (relative to the build context)
          file: packages/orchestrator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers from/to the GitHub Actions cache — dramatically speeds
          # up subsequent builds when only app code (not base layers) changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print a summary so engineers can quickly identify what was deployed.
      - name: Write job summary
        run: |
          echo "## Orchestrator Docker Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | ghcr.io |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`ghcr.io/${{ github.repository }}/orchestrator\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA tag | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Floating tag | \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
